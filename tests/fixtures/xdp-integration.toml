version = 1

[geo]
country = "CN"
provider = "mmdb"
url = "https://rules.example.test/country-lite.mmdb"
checksum_url = "https://rules.example.test/country-lite.mmdb.sha256sum"
update_interval = "24h"
max_age = "14d"
max_download_size = "32MiB"
max_change_ratio = 0.20

[xdp]
enabled = true
interface = "warddtest0"
attach_mode = "generic"
generic_fallback = false
geo_action = "observe"
ban_action = "observe"

[[xdp.geo_endpoint]]
address = "*"
protocol = "tcp"
port = 443

[ban]
protected_tcp_ports = [22, 80, 443]
exempt = []

[ban.auto]
enabled = true
event_source = "nginx_limit_req"
window = "60s"
rejections = 3
first_duration = "10m"
second_duration = "1h"
third_duration = "24h"
strike_retention = "7d"

[nginx]
enabled = true
generated_dir = "/tmp/wardd-xdp-test-generated"
limit_event_log = "/tmp/wardd-xdp-test-limit.log"
limit_zone = "api"

[firewall]
ownership = "none"
manage = false
