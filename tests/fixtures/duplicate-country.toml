version = 1

[geo]
country = ["CN", "CN"]
provider = "mmdb"
url = "https://rules.example.test/country-lite.mmdb"
checksum_url = "https://rules.example.test/country-lite.mmdb.sha256sum"
update_interval = "24h"
max_age = "14d"
max_download_size = "32MiB"
max_change_ratio = 0.20

[xdp]
enabled = true
interface = "eth0"
attach_mode = "auto"
generic_fallback = false
geo_action = "observe"
ban_action = "enforce"

[[xdp.geo_endpoint]]
address = "*"
protocol = "tcp"
port = 443

[[xdp.geo_endpoint]]
address = "2001:db8::10"
protocol = "tcp"
port = 8443

[ban]
protected_tcp_ports = [22, 80, 443]
exempt = ["203.0.113.10", "2001:db8:abcd::/48"]

[ban.auto]
enabled = false
event_source = "nginx_limit_req"
window = "60s"
rejections = 100
first_duration = "10m"
second_duration = "1h"
third_duration = "24h"
strike_retention = "7d"

[nginx]
enabled = true
generated_dir = "/etc/wardd/generated"
limit_event_log = "/var/log/nginx/wardd-limit.log"
limit_zone = "api"

[firewall]
ownership = "external"
manage = false
