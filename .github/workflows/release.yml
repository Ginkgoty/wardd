name: Stable release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.validate.outputs.version }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag and main ancestry
        id: validate
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(scripts/validate-release-tag.sh "$RELEASE_TAG")"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          echo "version=$version" >> "$GITHUB_OUTPUT"

  packages:
    name: Build stable packages
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/_packages.yml
    with:
      channel: stable
      retention_days: 30

  publish:
    name: Publish stable release
    needs:
      - validate
      - packages
    runs-on: ubuntu-24.04
    environment: stable-release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: wardd-stable-*
          path: release-assets
          merge-multiple: true

      - name: Verify assets and create checksums
        run: |
          test "$(find release-assets -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 2
          test "$(find release-assets -maxdepth 1 -type f -name '*.rpm' | wc -l)" -eq 2
          cd release-assets
          sha256sum ./*.deb ./*.rpm > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Attest released packages
        uses: actions/attest@v4
        with:
          subject-checksums: release-assets/SHA256SUMS

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag \
            --title "$RELEASE_TAG" \
            --generate-notes
